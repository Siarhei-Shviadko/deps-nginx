apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    {{- include "deps-nginx.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{ if .Values.nginx_settings.SSL.enabled }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: https
    {{ else }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{ end }}
  selector:
    {{- include "deps-nginx.selectorLabels" . | nindent 4 }}
