image:
  path: "/deps-platform/deps-nginx"

resources:

# Change to disable if need deploy to openshift
include_dns:
  enabled: true

ingress:
  enabled: true
  host: ""
  hostlabelingtool: ""
  tls:
    - secretName: tls-secret-ingress
      hosts:
        - ""

helm: 
  helm_logs_job_enabled: true
  
csi:
  vault_namespace: 'k8s-other'
  roleName: 'k8s-other'
  vaultKubernetesMountPath: 'kubernetes-other'

service_account:
  serviceAccountName: 'deps-other'

# Please keep README.md updated according to settings
nginx_settings:
  CLIENT_MAX_BODY_SIZE: '1000m'
