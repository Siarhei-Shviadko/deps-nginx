image:
  path: "/deps-presale-x01/deps-nginx"
  pullPolicy: Always

resources:

# Change to disable if need deploy to openshift
include_dns:
  enabled: true

ingress:
  enabled: true
  host: ""
  hostlabelingtool: ""
  tls:
    - secretName: tls-secret-ingress
      hosts:
        - ""

helm: 
  helm_logs_job_enabled: true
  
csi:
  vault_namespace: 'k8s-presale'
  roleName: 'k8s-presale'
  vaultKubernetesMountPath: 'kubernetes-presale'

service_account:
  serviceAccountName: 'deps-presale'

