image:
  path: "/deps-platform/deps-nginx"

resources:
  limits:
    cpu:
    memory:
  requests:
    cpu:
    memory:

      # Change to disable if need deploy to openshift
include_dns:
  enabled: true

ingress:
  enabled: true
  host: ""
  tls:
  - secretName: tls-secret-ingress
    hosts:
    - ""

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-qa'
  roleName: 'k8s-qa'
  vaultKubernetesMountPath: 'kubernetes-qa'

service_account:
  serviceAccountName: 'deps-qa'
